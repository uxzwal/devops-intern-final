name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up ShellCheck
        uses: ludeeus/action-shellcheck@v1
        with:
          path: scripts
      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3
        with:
          dockerfile: app/Dockerfile

  build:
    name: Build Image
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        run: |
          docker build \
            --build-arg BUILD_SHA=${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/devops-intern-final:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/devops-intern-final:latest \
            -f app/Dockerfile app

  test:
    name: Test Image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Run container
        run: |
          docker run -d --name test-nginx -p 8080:8080 ghcr.io/${{ github.repository_owner }}/devops-intern-final:${{ github.sha }}
          # Wait for container to become healthy (max 30s)
          timeout 30 bash -c "while ! curl -s http://localhost:8080/healthz >/dev/null; do sleep 1; done"
      - name: Healthcheck script
        run: |
          chmod +x scripts/healthcheck.sh
          ./scripts/healthcheck.sh http://localhost:8080
      - name: Cleanup
        if: always()
        run: docker rm -f test-nginx

  publish:
    name: Publish Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image tags
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/devops-intern-final:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/devops-intern-final:latest
